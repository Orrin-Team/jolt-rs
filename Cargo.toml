[workspace]
resolver = "3"
members = ["jolt-sys", "jolt"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Orrin-Team/jolt-rs"
keywords = ["physics", "jolt", "gamedev", "rigid-body"]
categories = ["game-development", "simulation"]

# Jolt is always compiled with optimisations (see jolt-sys/build.rs); this keeps the Rust side usable in tests too.
[profile.dev.package.orrin-jolt-sys]
opt-level = 1
