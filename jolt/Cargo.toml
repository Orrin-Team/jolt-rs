[package]
name = "orrin-jolt"
description = "Safe Rust bindings to Jolt Physics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[lib]
# Published as `orrin-jolt` because `jolt` is taken on crates.io; imported as
# `jolt` all the same.
name = "jolt"

[dependencies]
jolt-sys = { package = "orrin-jolt-sys", path = "../jolt-sys", version = "0.2.0" }
glam = { version = "0.34", optional = true }

[features]
asserts = ["jolt-sys/asserts"]
cross-platform-deterministic = ["jolt-sys/cross-platform-deterministic"]
# Draw bodies and constraints through `DebugRenderer`.
debug-renderer = ["jolt-sys/debug-renderer"]
# World space positions and transforms in double precision (`RVec3` = `DVec3`, `RMat44` = `DMat44`), for very large
# worlds. Slower and uses more memory.
double-precision = ["jolt-sys/double-precision"]
glam = ["dep:glam"]
